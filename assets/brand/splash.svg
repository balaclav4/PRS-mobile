<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Splash mark. Unlike the app icon nothing masks this one, so it carries its
    own corners, and it keeps the purple tile rather than sitting bare: the
    splash background is #F4F3F8 in light and #0F0E14 in dark, and a white
    ring would vanish against one of them.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B4DF0"/>
      <stop offset="1" stop-color="#4A24B4"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="229" ry="229" fill="url(#bg)"/>

  <circle cx="512" cy="512" r="312" fill="none" stroke="#FFFFFF" stroke-width="54"/>

  <g fill="#F0872B">
    <circle cx="432" cy="448" r="62"/>
    <circle cx="556" cy="420" r="66"/>
    <circle cx="496" cy="552" r="60"/>
  </g>
</svg>
