<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Splash mark. Nothing masks this one, so it carries its own corners.

    It keeps the buff card rather than floating the black disc bare. The splash
    background is #F4F3F8 in light and #0F0E14 in dark: a bare disc would be
    invisible against the dark one, and the card is what makes the mark read as
    paper in both.
  -->
  <rect width="1024" height="1024" rx="229" ry="229" fill="#EFE9DC"/>

  <circle cx="512" cy="512" r="336" fill="#17161D"/>
  <g stroke="#EFE9DC" stroke-width="28" fill="none">
    <circle cx="512" cy="512" r="244"/>
    <circle cx="512" cy="512" r="152"/>
  </g>
  <circle cx="512" cy="512" r="60" fill="#EFE9DC"/>

  <g fill="#F0872B">
    <circle cx="352" cy="368" r="56"/>
    <circle cx="442" cy="336" r="52"/>
    <circle cx="376" cy="452" r="54"/>
  </g>
</svg>
